<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Cuida!</title>
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="login.css">
  <!-- Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="logo">
        <img src="coracao.png" alt="Logo">
        <h1>Cuida!</h1>
      </div>

      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('user')">Usuário</button>
        <button class="tab-btn" onclick="switchTab('admin')">Administrador</button>
      </div>

      <!-- Login Usuário (Google) -->
      <div id="user-login" class="tab-content active">
        <p>Acesse com sua conta Google para consultar postos e fazer denúncias.</p>
        <div id="g_id_onload"
             data-client_id="981887511163-qqhb3ej5vkj1r77kdqjo7uki74keet16.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin" data-type="standard"></div>
      </div>

      <!-- Login Admin -->
      <div id="admin-login" class="tab-content">
        <form id="formAdmin">
          <input type="text" id="adm_user" placeholder="Usuário Admin" required>
          <input type="password" id="adm_pass" placeholder="Senha" required>
          <button type="submit" class="btn secundario">Entrar como Admin</button>
        </form>
        <p id="adm-error" class="error-msg"></p>
      </div>
    </div>
  </div>

  <script>
    // Se já estiver logado, vai direto para a página do usuário
    window.onload = function() {
      if (localStorage.getItem('isAdmin')) {
        window.location.href = 'index.html';
      } else if (localStorage.getItem('userPhoto')) {
        window.location.href = 'usuario.html';
      }
    };

    function switchTab(type) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      if(type === 'admin') {
        document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
        document.getElementById('admin-login').classList.add('active');
      } else {
        document.querySelector('.tab-btn:first-child').classList.add('active');
        document.getElementById('user-login').classList.add('active');
      }
    }

    // Lógica Admin (Hardcoded)
    document.getElementById('formAdmin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = document.getElementById('adm_user').value;
      const pass = document.getElementById('adm_pass').value;

      if(user === 'ADMcuida' && pass === 'cuida') {
        localStorage.clear();
        localStorage.setItem('isAdmin', 'true');
        window.location.href = 'index.html';
      } else {
        document.getElementById('adm-error').textContent = 'Usuário ou senha inválidos.';
      }
    });

    // Lógica Google
    async function handleCredentialResponse(response) {
      console.log("Token recebido do Google");
      // Em um app real, enviamos o token para o backend verificar
      // Aqui vamos simular o recebimento dos dados para salvar no banco
      const base64Url = response.credential.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));

      const payload = JSON.parse(jsonPayload);
      localStorage.clear();
      localStorage.setItem('userPhoto', payload.picture);
      localStorage.setItem('userName', payload.name);
      
      const res = await fetch('/api/auth/google', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nome: payload.name,
          email: payload.email,
          googleId: payload.sub
        })
      });

      const data = await res.json();
      if (res.ok) {
        console.log("Login no servidor OK:", data);
        window.location.href = 'usuario.html';
      } else {
        alert("Erro no login: " + data.message + (data.error ? " - Detalhes: " + data.error : ""));
      }
    }
  </script>
</body>
</html>
