<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Contato | Cuida!
  </title>

  <!-- CSS -->
  <link rel="stylesheet" href="global.css" />
  <link rel="stylesheet" href="contato.css" />

</head>

<body>

  <!-- HEADER -->
  <header>

    <div class="logo">

      <img
        src="../assets/coracao.png"
        alt="Logo"
      >

      <h1>
        Contato | Cuida!
      </h1>

    </div>

    <nav>

      <a href="index.html">
        Início
      </a>

      <a href="sobre.html">
        Sobre
      </a>

      <a href="contato.html">
        Contato
      </a>

    </nav>

  </header>

  <!-- CONTAINER -->
  <main class="contato-container">

    <!-- HERO -->
    <section class="contato-hero">

      <h2>
        Entre em contato 💚
      </h2>
      <br>

      <p>
        Tire dúvidas, envie sugestões ou relate problemas
        encontrados na plataforma.
      </p>
      <br>

    </section>

    <!-- GRID -->
    <section class="contato-grid">

      <!-- FORMULÁRIO -->
      <div class="contato-card">

        <h3>
          Fale conosco
        </h3>

        <form class="contato-form">

          <input
            type="text"
            placeholder="Seu nome"
            required
          >

          <input
            type="email"
            placeholder="Seu e-mail"
            required
          >

          <input
            type="text"
            placeholder="Assunto"
            required
          >

          <textarea
            rows="6"
            placeholder="Digite sua mensagem..."
            required
          ></textarea>

          <button type="submit">
            Enviar mensagem
          </button>

        </form>

      </div>

      <!-- INFORMAÇÕES -->
      <div class="contato-info">

        <div class="contato-card">

          <h3>
            Atendimento
          </h3>

          <p>
            🕒 Segunda à Sexta
          </p>

          <p>
            08:00 às 18:00
          </p>

        </div>

        <div class="contato-card">

          <h3>
            E-mail
          </h3>

          <p>
            📧 contato@Cuida.com
          </p>

        </div>

        <div class="contato-card">

          <h3>
            Comunidade
          </h3>

          <p>
            Participe do grupo da comunidade.
          </p>

          <button class="grupo-btn">
            💬 Entrar no grupo
          </button>

        </div>

      </div>

    </section>

  </main>

  <!-- FOOTER -->
  <footer>

    <p>
      © 2026 CUIDA!!
    </p>

  </footer>

</body>

</html>
